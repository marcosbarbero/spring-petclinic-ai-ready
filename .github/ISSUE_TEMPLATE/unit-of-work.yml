name: Unit of work
description: One self-contained change, small enough for a single agent session
title: "[unit] "
labels: ["needs-tier"]
body:
  - type: markdown
    attributes:
      value: |
        Every field is **required**. That is the point — a markdown template is a
        suggestion people delete; a form is a gate.

        If you cannot fill this in, the ticket is not ready to be implemented — by an
        agent *or* by a person who wasn't in the conversation where it was decided.

  - type: textarea
    id: context
    attributes:
      label: Context — what is broken, and why does it matter?
      description: >
        The background someone needs to understand the change. What happens today, who
        it affects, and what goes wrong if we leave it. Do not skip this because "it's
        obvious" — it is only obvious to the people in the room right now.
      placeholder: |
        PetValidator requires birthDate to be present but accepts any value, so a pet
        can be registered as born in 2087. Nothing downstream rejects it, so the bad row
        reaches the database and every age calculation built on it is wrong from then on.
    validations:
      required: true

  - type: textarea
    id: current_behaviour
    attributes:
      label: Current behaviour — and how you verified it
      description: >
        What the system does TODAY, and how you know. Name the file and line, or the test
        you ran, or the request you made. "It doesn't validate X" is a claim, not a fact,
        until you have looked at every path that could validate X.
        This field exists because a ticket once asserted a missing validation that had
        been implemented and tested for years, in a class the ticket never mentioned.
      placeholder: |
        PetValidator only checks birthDate for null (PetValidator.java:56).
        Verified the form path too: PetController.processCreationForm has no such check
        (checked lines 100-130), and no test in PetControllerTests covers it.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence. What is true after this ships that is not true now?
      placeholder: A pet can no longer be saved with a birth date in the future.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: >
        A numbered list of what the system MUST do. These are the specification.
        The scenarios below are how you PROVE each one — they are not a substitute.
        If a requirement has no scenario, it will not get tested; if a scenario has no
        requirement, it is scope creep.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: gherkin
    attributes:
      label: Test scenarios (Gherkin)
      description: >
        How each requirement is proven. At least TWO scenarios — one happy path is not
        acceptance criteria, cover the boundary.

        WRITE THEM AT THE LEVEL A USER FEELS, not the layer you expect the fix to live in.
        "When the pet is saved", not "when the pet is validated". Then apply the test:
        could this scenario pass while the feature is still broken for a user? If yes, it
        is at the wrong altitude — raise it.

        A scenario pinned to a class pre-decides the design, and anything outside that
        class silently leaves scope. That is how a validator gets raised to 50 characters
        against a VARCHAR(30) column, with every gate green.
      render: gherkin
      value: |
        Scenario: the happy path
          Given
          When
          Then

        Scenario: the boundary
          Given
          When
          Then
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Risk tier — how much can this break?
      description: >
        NOT how hard the work is. How big the blast radius is if it is wrong. The tier
        decides how the change lands, not how carefully it is written — everything gets
        the same gates. Tier 1 can merge on green because a mistake shows a wrong message
        on a form. Tier 3 never auto-merges because a mistake loses data, moves money, or
        grants access. If you are unsure between two, pick the higher one.
      options:
        - "tier-1 (low) — validation, mappers, docs, tests. Worst case: a form behaves oddly. Merges on green."
        - "tier-2 (medium) — CRUD endpoints, internal services. Worst case: a feature misbehaves for real users. Merges on green, human notified."
        - "tier-3 (high) — auth, payments, migrations, public API. Worst case: data loss, money, or access. Never auto-merges; a human signs off on intent."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area — which feature slice does this belong to?
      description: >
        The slice that owns this change. Naming it here means the agent is told where to
        work instead of searching for it — see `.claude/tools/arch_map.py list`.
        If the change genuinely spans two slices, stop: that is a design decision and
        probably two tickets.
      options:
        - "area:owner — owners, pets, visits"
        - "area:vet — veterinarians and specialties"
        - "area:system — cross-cutting web/cache config, error pages"
        - "area:model — shared kernel (BaseEntity, NamedEntity, Person)"
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: >
        Which files to touch, which patterns to follow, and explicitly what must NOT
        change. "Do not modify existing tests" belongs here almost every time — it is
        what stops a stuck agent deleting its way to green.
      value: |
        - Do not modify existing tests.
        - Change only:
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What someone might reasonably assume is included, but is not.
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: "Every requirement maps to at least one scenario, and every scenario to a test"
          required: true
        - label: "`./mvnw verify` green — format, lint, arch rules, tests, coverage"
          required: true
        - label: "`./mvnw -Pmutation verify` above threshold"
          required: true
