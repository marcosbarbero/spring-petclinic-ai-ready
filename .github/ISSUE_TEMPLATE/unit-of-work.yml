name: Unit of work
description: One self-contained change, small enough for a single agent session
title: "[unit] "
labels: ["tier-1"]
body:
  - type: markdown
    attributes:
      value: |
        Every field below is **required**. That is the point — a markdown template is a
        suggestion people delete; a form with required fields is a gate.
        If you cannot fill this in, the ticket is not ready to be implemented, by a
        person or by an agent.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence. What is true after this ships that is not true now?
      placeholder: A pet can no longer be saved with a birth date in the future.
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Risk tier
      description: The tier decides how this lands, not how carefully it is written.
      options:
        - "tier-1 — low: validation, mappers, docs. Gates decide, auto-merge."
        - "tier-2 — medium: CRUD, internal services. Auto-merge, notify."
        - "tier-3 — high: authn/authz, payments, migrations, public API. Human sign-off, never auto."
    validations:
      required: true
  - type: textarea
    id: gherkin
    attributes:
      label: Acceptance criteria (Gherkin)
      description: >
        At least TWO scenarios. One happy path is not acceptance criteria — cover the
        boundary. If you cannot express it as Given/When/Then, the requirement is not
        clear enough to implement.
      render: gherkin
      value: |
        Scenario: the happy path
          Given
          When
          Then

        Scenario: the boundary
          Given
          When
          Then
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Files to touch, patterns to follow, and explicitly what must NOT change.
      value: |
        - Do not modify existing tests.
        - Change only:
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of done
      options:
        - label: "`./mvnw verify` green — format, lint, arch rules, tests, coverage"
          required: true
        - label: "`./mvnw -Pmutation verify` above threshold"
          required: true
        - label: "Tests named for behaviour, not for the method under test"
          required: true
